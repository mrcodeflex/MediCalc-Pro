name: Unzip Archive
on:
  push:
    paths:
      - '**.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          unzip -o "*.zip"
          rm -f *.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Unzip uploaded archive"
          git push
